[project]
name = "opensmoke"
version = "0.1.0"
description = "Catch AI agents that broke in production because their environment did: missing tools, keys, files, permissions, or context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aarav Iyer", email = "aaravriyer@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ai-agents", "observability", "monitoring", "llm", "typesafe", "jev"]
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
opensmoke = "opensmoke.cli:main"

[project.urls]
Repository = "https://github.com/aaravriyer193/OpenSmoke"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
